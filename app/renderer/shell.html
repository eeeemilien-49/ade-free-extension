<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Claude Code Bridge</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <header class="top">
    <div class="side">
      <button id="project" class="project" title="Projets">
        <span id="projectName">Aucun projet</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <nav class="nav">
      <button id="back" class="icon" title="Précédent (⌘[)" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button id="forward" class="icon" title="Suivant (⌘])" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button id="reload" class="icon" title="Recharger (⌘R)" aria-label="Recharger"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <form id="addressForm" class="address">
        <input id="address" spellcheck="false" autocomplete="off" placeholder="Adresse de la page" />
      </form>
      <button id="server" class="server" title="Serveur de dev"><span class="dot"></span><span id="serverText">—</span></button>
    </nav>
  </header>

  <main class="stage">
    <section id="welcome" class="welcome" hidden>
      <h1>Ouvre un projet</h1>
      <p>Son serveur de dev démarre et la page s'affiche ici.<br />⌘ + clic sur un élément pour le commenter.</p>
      <button id="pick" class="primary">Ouvrir un dossier…</button>
      <ul id="recents" class="recents"></ul>
    </section>
    <section id="status" class="status" hidden>
      <div class="status-head">
        <span id="statusTitle" class="shimmer"></span>
        <span class="grow"></span>
        <button id="retry" class="btn" hidden>Réessayer</button>
        <button id="backToPage" class="btn" hidden>Revenir à la page</button>
      </div>
      <p id="statusDetail" class="detail"></p>
      <pre id="logs" class="logs"></pre>
    </section>
  </main>
  <script src="shell.js"></script>
</body>
</html>
