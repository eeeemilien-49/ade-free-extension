# Petit exécutant XCUITest : il lit l'arbre des composants de n'importe quelle app du simulateur
# et rejoue les touchers, sans rien ajouter au projet de l'utilisateur (comme WebDriverAgent).
name: BridgeRunner
options:
  bundleIdPrefix: com.claude.bridge
  deploymentTarget:
    iOS: "17.0"
settings:
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGN_IDENTITY: ""
targets:
  BridgeHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      GENERATE_INFOPLIST_FILE: "YES"
      PRODUCT_BUNDLE_IDENTIFIER: com.claude.bridge.host
  BridgeRunner:
    type: bundle.ui-testing
    platform: iOS
    sources: [Runner]
    dependencies:
      - target: BridgeHost
    settings:
      GENERATE_INFOPLIST_FILE: "YES"
      PRODUCT_BUNDLE_IDENTIFIER: com.claude.bridge.runner
      TEST_TARGET_NAME: BridgeHost
